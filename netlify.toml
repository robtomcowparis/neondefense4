# Netlify config — redirects only. Build settings remain in the Netlify UI.
#
# The /calendar/* rules proxy the Calendar Assistant at neondefense4.com/calendar/
# to a FastAPI backend running on Google Cloud Run. Swap CLOUD_RUN_URL below
# after deploying the backend (see Calendar Agent/DEPLOY.md).

# Wildspell's sign-in (robtomcowparis/wildspell, docs/online-plan.md Phase 0 step 2): Firebase Authentication's
# handler pages served from the site's own domain, so Safari and the home-screen app keep the session that a bounce
# through wildspell-83372.firebaseapp.com would lose. The game's authDomain is neondefense4.com.
[[redirects]]
  from = "/__/auth/*"
  to = "https://wildspell-83372.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://wildspell-83372.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/calendar/*"
  to = "https://calendar-assistant-557006098611.us-west1.run.app/:splat"
  status = 200
  force = true

[build.environment]
  # Vite 7 needs Node 20.19 or newer; pin what the site is built with.
  NODE_VERSION = "22"
